# Host nginx config for the static Next.js landing (elijah-pavlov.nz).
#
# This is the HTTP-only base. Run certbot afterwards (see deploy/README.md) —
# it will inject the TLS lines and the HTTP->HTTPS redirect automatically.
#
# Install on the server as: /etc/nginx/sites-available/elijah-pavlov.nz
# then symlink into /etc/nginx/sites-enabled/ and reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name elijah-pavlov.nz www.elijah-pavlov.nz;

    root /var/www/elijah-pavlov;
    index index.html;

    # Static export uses trailingSlash: true, so each route is a folder with
    # an index.html. Fall back to .html files and finally the custom 404 page.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Long-lived immutable assets (hashed filenames under /_next/static).
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Don't let robots.txt get cached for a year while the site is private.
    location = /robots.txt {
        add_header Cache-Control "no-store";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
